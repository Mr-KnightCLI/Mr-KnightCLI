<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="126" viewBox="0 0 1000 126"><defs><linearGradient id="paper"><stop stop-color="#111612"/><stop offset="1" stop-color="#090e0a"/></linearGradient><linearGradient id="fade"><stop stop-color="#a96136"/><stop offset=".45" stop-color="#e9b16c"/><stop offset="1" stop-color="#589b65"/></linearGradient><pattern id="ticks" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 0v5" stroke="#c18150" opacity=".65"/></pattern></defs><style>.pulse{stroke-dasharray:45 955;stroke-dashoffset:0;animation:run 5s linear infinite}.b{animation-delay:-2s}.orb{animation:breathe 2.8s ease-in-out infinite alternate}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes breathe{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orb{animation:none}.pulse{display:none}}</style><rect width="1000" height="126" fill="url(#paper)"/><path d="M24 19h58M24 19v89M976 19h-58M976 19v89" fill="none" stroke="#675038"/><text x="43" y="66" font-family="Georgia,serif" fill="#f2ead4" font-size="47">TabTamer</text><text x="45" y="95" font-family="monospace" letter-spacing="3" fill="#d5a371" font-size="15">NEXT.JS / BROWSER EXTENSION</text><rect x="644" y="21" width="314" height="12" fill="url(#ticks)"/><path d="M644 100h78l32-24h32l31 24h141" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M644 100h78l32-24h32l31 24h141" pathLength="1000" fill="none" stroke="#dfab6b" stroke-width="3" stroke-linecap="round"/><circle cx="958" cy="100" r="9" fill="none" stroke="#e5af6c" opacity=".4"/><circle class="orb" cx="958" cy="100" r="3.5" fill="#e5af6c"/></svg>
