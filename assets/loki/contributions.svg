<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232"><defs><linearGradient id="paper"><stop stop-color="#111612"/><stop offset="1" stop-color="#090e0a"/></linearGradient><linearGradient id="fade"><stop stop-color="#a96136"/><stop offset=".45" stop-color="#e9b16c"/><stop offset="1" stop-color="#589b65"/></linearGradient><pattern id="ticks" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 0v5" stroke="#c18150" opacity=".65"/></pattern></defs><style>.pulse{stroke-dasharray:45 955;stroke-dashoffset:0;animation:run 5s linear infinite}.b{animation-delay:-2s}.orb{animation:breathe 2.8s ease-in-out infinite alternate}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes breathe{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orb{animation:none}.pulse{display:none}}</style><rect width="1000" height="232" fill="url(#paper)"/><rect x="38" y="14" width="924" height="12" fill="url(#ticks)"/><text x="38" y="63" font-family="monospace" letter-spacing="3" fill="#e2aa72" font-size="17">THE BRANCHING TIMELINE</text><text x="38" y="138" font-family="Georgia,serif" fill="#f2ead4" font-size="44">6 merged</text><text x="40" y="166" font-family="monospace" letter-spacing="3" fill="#a4ba9f" font-size="14">PULL REQUESTS</text><path d="M285 143H421C503 143 500 103 580 103H705" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M285 143H421C503 143 500 103 580 103H705" pathLength="1000" fill="none" stroke="#dfab6b" stroke-width="3" stroke-linecap="round"/><path d="M421 143C503 143 500 184 580 184H705" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M421 143C503 143 500 184 580 184H705" pathLength="1000" fill="none" stroke="#8dcf91" stroke-width="3" stroke-linecap="round"/><circle cx="421" cy="143" r="9" fill="none" stroke="#e5af6c" opacity=".4"/><circle class="orb" cx="421" cy="143" r="3.5" fill="#e5af6c"/><circle cx="705" cy="103" r="9" fill="none" stroke="#e5af6c" opacity=".4"/><circle class="orb" cx="705" cy="103" r="3.5" fill="#e5af6c"/><circle cx="705" cy="184" r="9" fill="none" stroke="#8dcf91" opacity=".4"/><circle class="orb" cx="705" cy="184" r="3.5" fill="#8dcf91"/><text x="727" y="111" font-family="Georgia,serif" fill="#f2ead4" font-size="31">Google</text><text x="727" y="193" font-family="Georgia,serif" fill="#f2ead4" font-size="31">Microsoft</text><text x="923" y="110" font-family="monospace" letter-spacing="3" fill="#e2aa72" font-size="20">03</text><text x="923" y="193" font-family="monospace" letter-spacing="3" fill="#a4ba9f" font-size="20">03</text></svg>
