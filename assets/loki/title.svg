<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="166" viewBox="0 0 1000 166"><defs><linearGradient id="paper"><stop stop-color="#111612"/><stop offset="1" stop-color="#090e0a"/></linearGradient><linearGradient id="fade"><stop stop-color="#a96136"/><stop offset=".45" stop-color="#e9b16c"/><stop offset="1" stop-color="#589b65"/></linearGradient><pattern id="ticks" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 0v5" stroke="#c18150" opacity=".65"/></pattern></defs><style>.pulse{stroke-dasharray:45 955;stroke-dashoffset:0;animation:run 5s linear infinite}.b{animation-delay:-2s}.orb{animation:breathe 2.8s ease-in-out infinite alternate}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes breathe{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orb{animation:none}.pulse{display:none}}</style><rect width="1000" height="166" fill="url(#paper)"/><rect x="34" y="14" width="932" height="12" fill="url(#ticks)"/><text x="35" y="60" font-family="monospace" letter-spacing="3" fill="#e2aa72" font-size="16">TIME VARIANCE AUTHORITY / DEVELOPER PROFILE</text><text x="32" y="119" font-family="Georgia,serif" fill="#f2ead4" font-size="60">Harsh Bhardwaj</text><text x="740" y="112" font-family="monospace" letter-spacing="3" fill="#b4ccac" font-size="14">JAVA / OPEN SOURCE</text><path d="M34 145H966" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M34 145H966" pathLength="1000" fill="none" stroke="#dfab6b" stroke-width="3" stroke-linecap="round"/><circle cx="669" cy="145" r="9" fill="none" stroke="#e5af6c" opacity=".4"/><circle class="orb" cx="669" cy="145" r="3.5" fill="#e5af6c"/></svg>
