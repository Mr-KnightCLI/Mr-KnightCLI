<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44"><defs><linearGradient id="paper"><stop stop-color="#111612"/><stop offset="1" stop-color="#090e0a"/></linearGradient><linearGradient id="fade"><stop stop-color="#a96136"/><stop offset=".45" stop-color="#e9b16c"/><stop offset="1" stop-color="#589b65"/></linearGradient><pattern id="ticks" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 0v5" stroke="#c18150" opacity=".65"/></pattern></defs><style>.pulse{stroke-dasharray:45 955;stroke-dashoffset:0;animation:run 5s linear infinite}.b{animation-delay:-2s}.orb{animation:breathe 2.8s ease-in-out infinite alternate}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes breathe{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.orb{animation:none}.pulse{display:none}}</style><rect width="1000" height="44" fill="url(#paper)"/><path d="M24 24H380C412 24 416 12 465 12H976" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M24 24H380C412 24 416 12 465 12H976" pathLength="1000" fill="none" stroke="#dfab6b" stroke-width="3" stroke-linecap="round"/><path d="M380 24C412 24 416 34 465 34H976" fill="none" stroke="url(#fade)" stroke-opacity=".65" stroke-width="1.5"/><path class="pulse" d="M380 24C412 24 416 34 465 34H976" pathLength="1000" fill="none" stroke="#8dcf91" stroke-width="3" stroke-linecap="round"/><circle cx="380" cy="24" r="9" fill="none" stroke="#e5af6c" opacity=".4"/><circle class="orb" cx="380" cy="24" r="3.5" fill="#e5af6c"/></svg>
