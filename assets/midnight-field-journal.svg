<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" role="img" aria-labelledby="title"><title id="title">Midnight Mission. A silver crescent travels over the pyramids.</title><defs><linearGradient id="sky"><stop stop-color="#0c101b"/><stop offset="1" stop-color="#293a52"/></linearGradient><style>.moon{animation:rise 16s ease-in-out infinite alternate}.stars{animation:glow 8s ease-in-out infinite alternate}@keyframes rise{to{transform:translate(9px,-9px)}}@keyframes glow{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="960" height="210" fill="url(#sky)"/><g fill="#e5d8b6" class="stars"><path transform="translate(552 44)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(637 27)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(687 85)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(899 38)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(848 96)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(613 124)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(730 37)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(934 108)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/></g><g class="moon"><path d="M822 27A44 44 0 1 0 858 86A44 44 0 0 1 822 27Z" fill="#f6efda"/></g><path d="m574 210 102-88 93 88m-58 0 99-116 137 116" fill="#182334" stroke="#75869a"/><path d="m676 122 26 88h67zm134-28 29 116h108z" fill="#101824"/><path d="M36 44v120" stroke="#bda777"/><g fill="#eeeadd"><text x="60" y="65" font-family="monospace" font-size="16" letter-spacing="3" fill="#c8b489">MR-KNIGHTCLI / FIELD JOURNAL</text><text x="56" y="131" font-family="Georgia,serif" font-size="62">Midnight Mission</text><text x="60" y="163" font-family="sans-serif" font-size="18" fill="#c4cfdd">Harsh Bhardwaj · Java developer</text></g></svg>
