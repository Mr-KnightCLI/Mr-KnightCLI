<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" role="img" aria-labelledby="title"><title id="title">Midnight Mission. A silver crescent travels over the pyramids.</title><defs><linearGradient id="sky"><stop stop-color="#0c101b"/><stop offset="1" stop-color="#293a52"/></linearGradient><style>.moon{animation:rise 16s ease-in-out infinite alternate}.stars{animation:glow 8s ease-in-out infinite alternate}@keyframes rise{to{transform:translate(9px,-9px)}}@keyframes glow{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.veil{animation:veil 10s ease-in-out infinite alternate}.eye{animation:eye 6s ease-in-out infinite alternate}.seam{stroke-dasharray:450;animation:trace 12s ease-in-out infinite}.ribbon{animation:drift 9s ease-in-out infinite alternate}@keyframes veil{to{transform:translate(5px,-2px);opacity:.65}}@keyframes eye{to{opacity:.46}}@keyframes trace{0%,100%{stroke-dashoffset:450}50%,70%{stroke-dashoffset:0}}@keyframes drift{to{transform:translate(-9px,2px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="960" height="210" fill="url(#sky)"/><g fill="#e5d8b6" class="stars"><path transform="translate(552 44)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(637 27)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(687 85)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(899 38)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(848 96)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(613 124)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(730 37)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/><path transform="translate(934 108)" d="M0 -4 1 -1 4 0 1 1 0 4 -1 1 -4 0 -1 -1Z"/></g><g class="moon"><path d="M822 27A44 44 0 1 0 858 86A44 44 0 0 1 822 27Z" fill="#f6efda"/></g><path d="m574 210 102-88 93 88m-58 0 99-116 137 116" fill="#182334" stroke="#75869a"/><path d="m676 122 26 88h67zm134-28 29 116h108z" fill="#101824"/><g transform="translate(675 6)"><g class="veil"><path d="M-75 201Q-63 174 -35 155Q-63 119 -22 61Q-7 39 9 28Q44 43 59 87Q71 122 51 152Q78 171 86 204" fill="#d5d9db"/><path d="M-40 137Q-38 91 10 56Q41 75 51 115L35 150L12 174L-18 151Z" fill="#222a38"/><path d="M-40 137Q-59 108 -24 65L9 28Q-3 55 -23 80Z" fill="#a4acb7"/><path d="M-27 117L-2 109 22 117 43 105 25 135 3 156Z" fill="#475566"/><g class="eye" fill="#f5ffff"><path d="m-25 102 24 5 -6 5 -15 -4Z"/><path d="m12 105 24 -12 -4 9 -17 9Z"/></g><path d="m-16 123 44 -8m-38 16 33 -6m-26 14 21 -4" fill="none" stroke="#aab4c0"/><path d="M-44 162Q-2 192 42 155L10 194Z" fill="#84909f"/><path d="M-48 165Q-63 168 -92 158T-148 164Q-118 152 -91 165T-50 175" class="ribbon" fill="#aab4c0"/></g></g><path d="m677 12 -18 52 19 25 -32 42 11 30 -22 49" fill="none" stroke="#d4edff" opacity=".72" class="seam"/><path d="M36 44v120" stroke="#bda777"/><g fill="#eeeadd"><text x="60" y="65" font-family="monospace" font-size="16" letter-spacing="3" fill="#c8b489">MR-KNIGHTCLI / FIELD JOURNAL</text><text x="56" y="131" font-family="Georgia,serif" font-size="62">Midnight Mission</text><text x="60" y="163" font-family="sans-serif" font-size="18" fill="#c4cfdd">Harsh Bhardwaj · Java developer</text></g></svg>
