 <text x="55" y="54" font-family="Consolas,monospace" font-size="18" font-weight="400" fill="#b5a27c">01 / BEHIND THE MASK</text><text x="55" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="400" fill="#e6dfd0">The work speaks for itself.</text><text x="55" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#e6dfd0">Hey, I’m Harsh — @Aoi-Todoo.</text><text x="55" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#a7a8a5">I build web apps, practical tools, and</text><text x="55" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#a7a8a5">the backend systems that make them work.</text><text x="55" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#b5a27c">Curiosity starts the mission. Working code finishes it.</text><rect x="785" y="137" width="439" height="165" rx="3" fill="#070a09" stroke="#444c41" /><text x="808" y="173" font-family="Consolas,monospace" font-size="18" font-weight="400" fill="#b5a27c">~/midnight/harsh</text><text x="808" y="219" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#e6dfd0">$ ./mvnw test</text><text x="808" y="265" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#a7a8a5">$ pnpm build</text><circle cx="242" cy="252" r="0.8" fill="#e6dfd0" opacity=".18">
