<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="a-title a-desc"><title id="a-title">The armory — Java at the core</title><desc id="a-desc">Java, Spring Boot, TypeScript, Next.js, WebSockets and JUnit 5. Animated lunar orbit with slowly moving markers.</desc><defs><radialGradient id="halo"><stop stop-color="#d4e4dd" stop-opacity=".09"/><stop offset="1" stop-color="#d4e4dd" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="290" fill="#050609"/><circle cx="200" cy="145" r="160" fill="url(#halo)"/><g fill="none" stroke="#9eafaf"><circle cx="200" cy="145" r="105" opacity=".25"/><circle cx="200" cy="145" r="123" opacity=".35" stroke-dasharray="65 17 2 21"><animateTransform attributeName="transform" type="rotate" from="0 200 145" to="360 200 145" dur="50s" repeatCount="indefinite"/></circle><g><circle cx="305" cy="145" r="4" fill="#e3e6d8"/><animateTransform attributeName="transform" type="rotate" from="0 200 145" to="360 200 145" dur="20s" repeatCount="indefinite"/></g></g><text x="200" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#eee9dc">Java</text><text x="200" y="177" text-anchor="middle" font-family="Consolas,monospace" letter-spacing="3" font-size="12" fill="#bfc6cd">AT THE CORE</text><path d="M365 45V245" stroke="#788d90" stroke-opacity=".25"/><g font-family="Consolas,monospace" fill="#d8dfd8"><text x="420" y="85" font-size="12" letter-spacing="2" fill="#bfc6cd">01 / BACKEND</text><text x="420" y="119" font-size="21">Spring Boot · REST APIs</text><path d="M420 137h300" stroke="#798f91" stroke-opacity=".25"/><circle cx="420" cy="137" r="2" fill="#d9e8e4"><animate attributeName="cx" values="420;720;420" dur="8s" repeatCount="indefinite"/></circle><text x="810" y="85" font-size="12" letter-spacing="2" fill="#bfc6cd">02 / WEB</text><text x="810" y="119" font-size="21">TypeScript · Next.js</text><path d="M810 137h300" stroke="#798f91" stroke-opacity=".25"/><circle cx="810" cy="137" r="2" fill="#d9e8e4"><animate attributeName="cx" values="810;1110;810" dur="9s" repeatCount="indefinite"/></circle><text x="420" y="209" font-size="12" letter-spacing="2" fill="#bfc6cd">03 / REAL TIME</text><text x="420" y="243" font-size="21">WebSockets · H2</text><path d="M420 261h300" stroke="#798f91" stroke-opacity=".25"/><circle cx="420" cy="261" r="2" fill="#d9e8e4"><animate attributeName="cx" values="420;720;420" dur="10s" repeatCount="indefinite"/></circle><text x="810" y="209" font-size="12" letter-spacing="2" fill="#bfc6cd">04 / VERIFICATION</text><text x="810" y="243" font-size="21">Maven · JUnit 5</text><path d="M810 261h300" stroke="#798f91" stroke-opacity=".25"/><circle cx="810" cy="261" r="2" fill="#d9e8e4"><animate attributeName="cx" values="810;1110;810" dur="11s" repeatCount="indefinite"/></circle></g></svg>
