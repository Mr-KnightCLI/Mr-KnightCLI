<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Merged contributions to Google and Microsoft</title><desc id="desc">Google OR-Tools PR 5501 merged 19 October 2026. Microsoft Java Debug PR 648 merged 2 November 2026. Animated branch paths celebrate accepted upstream contributions.</desc><defs><linearGradient id="field" x2="1" y2="1"><stop stop-color="#080a0e"/><stop offset="1" stop-color="#030407"/></linearGradient></defs><rect width="1200" height="370" fill="url(#field)"/><path d="M0 1H1200" stroke="#d9dfe8" stroke-width="2"/><text x="40" y="45" fill="#c3c9d0" font-family="Consolas,monospace" font-size="13" letter-spacing="3">THE MISSION REACHED UPSTREAM</text><text x="38" y="103" fill="#f0eadc" font-family="Georgia,serif" font-size="53">Built here. Merged there.</text><g transform="translate(40 153)"><path d="M0 0H545" stroke="#748e91" stroke-opacity=".35"/><text x="0" y="55" font-family="Georgia,serif" font-size="38" fill="#eee9dc">Google</text><text x="0" y="86" font-family="Consolas,monospace" font-size="15" letter-spacing="2" fill="#b9cbc8">OR-TOOLS / #5501</text><text x="0" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e5e7db">Preserve precision.</text><text x="0" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a5b5b8">Protect the exported model.</text><text x="0" y="205" font-family="Consolas,monospace" font-size="13" letter-spacing="1" fill="#b8c98f">MERGED / 19 OCT 2026</text><g transform="translate(425 32)" stroke="#cbded7" fill="none" stroke-width="2"><path d="M25 0V110M80 0V50Q80 75 25 75" opacity=".3"/><path d="M80 0V50Q80 75 25 75V110" stroke="#ddd1af" stroke-dasharray="18 150"></path><circle cx="25" cy="0" r="7" fill="#080a0e"/><circle cx="80" cy="0" r="7" fill="#080a0e"/><circle cx="25" cy="110" r="12" fill="#080a0e"/><path d="M19 110l4 4 8-9" stroke="#c9dcaa"/><circle cx="25" cy="110" r="18" stroke="#c9dcaa" opacity=".2"></circle></g></g><g transform="translate(625 153)"><path d="M0 0H545" stroke="#748e91" stroke-opacity=".35"/><text x="0" y="55" font-family="Georgia,serif" font-size="38" fill="#eee9dc">Microsoft</text><text x="0" y="86" font-family="Consolas,monospace" font-size="15" letter-spacing="2" fill="#b9cbc8">JAVA DEBUG / #648</text><text x="0" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#e5e7db">Fix event order.</text><text x="0" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a5b5b8">Keep the debugger state accurate.</text><text x="0" y="205" font-family="Consolas,monospace" font-size="13" letter-spacing="1" fill="#b8c98f">MERGED / 02 NOV 2026</text><g transform="translate(425 32)" stroke="#cbded7" fill="none" stroke-width="2"><path d="M25 0V110M80 0V50Q80 75 25 75" opacity=".3"/><path d="M80 0V50Q80 75 25 75V110" stroke="#ddd1af" stroke-dasharray="18 150"></path><circle cx="25" cy="0" r="7" fill="#080a0e"/><circle cx="80" cy="0" r="7" fill="#080a0e"/><circle cx="25" cy="110" r="12" fill="#080a0e"/><path d="M19 110l4 4 8-9" stroke="#c9dcaa"/><circle cx="25" cy="110" r="18" stroke="#c9dcaa" opacity=".2"></circle></g></g></svg>
